name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write # To report GitHub Actions status checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@v8.1.0 # x-release-please-version
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # https://github.com/super-linter/super-linter?tab=readme-ov-file#configure-super-linter
          VALIDATE_GIT_COMMITLINT: false
          FILTER_REGEX_EXCLUDE: "(^.obsidian/|^assets/)"
          FIX_GITHUB_ACTIONS_ZIZMOR: true
          FIX_PYTHON_RUFF: true
          FIX_JSON: true
          FIX_MARKDOWN_PRETTIER: true
          FIX_NATURAL_LANGUAGE: true
          FIX_SHELL_SHFMT: true
          IGNORE_GENERATED_FILES: true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: MikeSchulze/gdunit4-action@v1
        with:
          godot-version: "4.4.1"
          paths: "res://tests"
          timeout: 10 # Optional: Test timeout in minutes
          version: "latest" # Optional: GdUnit4 version
