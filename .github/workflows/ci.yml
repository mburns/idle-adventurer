name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop, idlerpg]
  release:
    types: [published]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: abarichello/godot-ci@4.4.1-stable

      - name: Setup Python for YAML validation
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install pyyaml

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."

          # Check all YAML files for syntax errors
          find data/ -name "*.yaml" -exec echo "Validating {}" \; -exec python3 -c "
          import yaml
          import sys
          try:
              with open('{}', 'r') as f:
                  yaml.safe_load(f)
              print('✓ {} is valid')
          except yaml.YAMLError as e:
              print('✗ {} has YAML syntax error: {}'.format('{}', e))
              sys.exit(1)
          except Exception as e:
              print('✗ {} has error: {}'.format('{}', e))
              sys.exit(1)
          " \;

      - name: Validate data structure consistency
        run: |
          echo "Validating data structure consistency..."

          # Check that required directories exist
          test -d "data/classes" || (echo "Missing data/classes directory" && exit 1)
          test -d "data/races" || (echo "Missing data/races directory" && exit 1)
          test -d "data/backgrounds" || (echo "Missing data/backgrounds directory" && exit 1)
          test -d "data/spells" || (echo "Missing data/spells directory" && exit 1)
          test -d "data/items" || (echo "Missing data/items directory" && exit 1)
          test -d "data/activities" || (echo "Missing data/activities directory" && exit 1)

          # Check that key files exist
          test -f "data/currency.yaml" || (echo "Missing data/currency.yaml" && exit 1)
          test -f "data/languages.yaml" || (echo "Missing data/languages.yaml" && exit 1)
          test -f "data/level_requirements.yaml" || (echo "Missing data/level_requirements.yaml" && exit 1)

          # Validate that classes have required fields
          for class_file in data/classes/*.yaml; do
            if [ -f "$class_file" ]; then
              echo "Validating class file: $class_file"
              python3 -c "
          import yaml
          with open('$class_file', 'r') as f:
              data = yaml.safe_load(f)
              required_fields = ['name', 'hit_die', 'primary_ability', 'saving_throw_proficiencies']
              for field in required_fields:
                  if field not in data:
                      print(f'✗ Missing required field: {field}')
                      exit(1)
              print(f'✓ {class_file} has all required fields')
          " || exit 1
            fi
          done

          echo "✓ Data structure validation passed!"

      - name: Validate script imports
        run: |
          echo "Validating script imports..."

          # Check for old import paths that may need updating
          if grep -r "res://scripts/[^/]*\.gd" scripts/ --include="*.gd"; then
            echo "Warning: Found old import paths that may need updating"
          fi

          # Check for missing class_name declarations in key files
          for file in scripts/core/*.gd scripts/systems/*.gd scripts/ui/*.gd; do
            if [ -f "$file" ] && ! grep -q "class_name" "$file"; then
              echo "Warning: $file may be missing class_name declaration"
            fi
          done

          echo "✓ Import validation completed"

      - name: Run unit tests
        run: |
          godot --headless --script tests/unit/simple_test_runner.gd --quit

      - name: Run comprehensive tests
        run: |
          godot --headless --script tests/unit/test_runner_comprehensive.gd --quit

      - name: Run performance tests
        run: |
          godot --headless --script tests/test_performance.gd --quit

      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for TODO/FIXME comments..."
          if grep -r "TODO\|FIXME\|HACK\|XXX" scripts/ --include="*.gd"; then
            echo "Found TODO/FIXME/HACK comments - please review before merging"
            echo "Consider creating issues for these items"
          fi

  build:
    name: Build Game
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: abarichello/godot-ci@4.4.1-stable

      - name: Create builds directory
        run: |
          mkdir -p builds/linux builds/windows builds/macos

      - name: Export project (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          godot --headless --export-debug "Linux/X11" builds/linux/idle-adventurer.x86_64
          chmod +x builds/linux/idle-adventurer.x86_64

      - name: Export project (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          godot --headless --export-debug "Windows Desktop" builds/windows/idle-adventurer.exe

      - name: Export project (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          godot --headless --export-debug "macOS" builds/macos/idle-adventurer.app

      - name: Verify build artifacts
        run: |
          echo "Verifying build artifacts..."
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            test -f builds/linux/idle-adventurer.x86_64 || (echo "Linux build failed" && exit 1)
            echo "✓ Linux build successful"
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -f builds/windows/idle-adventurer.exe || (echo "Windows build failed" && exit 1)
            echo "✓ Windows build successful"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            test -d builds/macos/idle-adventurer.app || (echo "macOS build failed" && exit 1)
            echo "✓ macOS build successful"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idle-adventurer-${{ matrix.os }}
          path: builds/
          retention-days: 30
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archive
        run: |
          echo "Creating release archive..."
          mkdir -p release

          # Copy platform-specific builds
          if [ -d "idle-adventurer-ubuntu-latest" ]; then
            cp -r idle-adventurer-ubuntu-latest/* release/
            echo "✓ Added Linux build"
          fi

          if [ -d "idle-adventurer-windows-latest" ]; then
            cp -r idle-adventurer-windows-latest/* release/
            echo "✓ Added Windows build"
          fi

          if [ -d "idle-adventurer-macos-latest" ]; then
            cp -r idle-adventurer-macos-latest/* release/
            echo "✓ Added macOS build"
          fi

          # Add documentation
          cp README.md release/ 2>/dev/null || echo "README.md not found"
          cp LICENSE release/ 2>/dev/null || echo "LICENSE not found"
          cp CHANGELOG.md release/ 2>/dev/null || echo "CHANGELOG.md not found"

          # Create zip archive
          cd release
          zip -r ../idle-adventurer-${{ github.event.release.tag_name }}.zip .
          cd ..

          echo "✓ Release archive created: idle-adventurer-${{ github.event.release.tag_name }}.zip"

      - name: Generate release notes
        run: |
          echo "Generating release notes..."

          # Get commit messages since last release
          if [ -n "${{ github.event.release.previous_tag }}" ]; then
            echo "## Changes since ${{ github.event.release.previous_tag }}" > release_notes.md
            git log --pretty=format:"- %s" ${{ github.event.release.previous_tag }}..HEAD >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
            echo "First release of Idle Adventurer!" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "1. Download the appropriate file for your platform" >> release_notes.md
          echo "2. Extract/run the executable" >> release_notes.md
          echo "3. Enjoy your D&D idle adventure!" >> release_notes.md

          cat release_notes.md

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.upload_url }}
          asset_path: ./idle-adventurer-${{ github.event.release.tag_name }}.zip
          asset_name: idle-adventurer-${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip
