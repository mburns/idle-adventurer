name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write # To report GitHub Actions status checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      # cfg file lint
      # markdown

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: MikeSchulze/gdunit4-action@a5b68eab7dd87974a2b44dc047685ff86fabfabb # v1.1.6
        with:
          godot-version: "4.4.1"
          paths: "res://tests"
          timeout: 10 # Optional: Test timeout in minutes
          version: "latest" # Optional: GdUnit4 version
