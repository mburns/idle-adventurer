name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, idlerpg]
  pull_request:
    branches: [main, develop, idlerpg]
  release:
    types: [published]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: abarichello/godot-ci@4.4.1-stable

      - name: Run unit tests
        run: |
          godot --headless --script tests/unit/simple_test_runner.gd --quit

      - name: Run comprehensive tests
        run: |
          godot --headless --script tests/unit/test_runner_comprehensive.gd --quit

      - name: Run linting
        run: |
          godot --headless --script scripts/lint.gd --quit

  build:
    name: Build Game
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: abarichello/godot-ci@4.4.1-stable

      - name: Export project
        run: |
          godot --headless --export-debug "Linux/X11" builds/linux/idle-adventurer.x86_64
          godot --headless --export-debug "Windows Desktop" builds/windows/idle-adventurer.exe
          godot --headless --export-debug "macOS" builds/macos/idle-adventurer.app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: idle-adventurer-${{ matrix.os }}
          path: builds/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create release archive
        run: |
          mkdir -p release
          cp -r idle-adventurer-ubuntu-latest/* release/
          cp -r idle-adventurer-windows-latest/* release/
          cp -r idle-adventurer-macos-latest/* release/

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.upload_url }}
          asset_path: ./release/
          asset_name: idle-adventurer-${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip
