name: Publish Game Release

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: abarichello/godot-ci@4.4.1-stable
        with:
          godot-version: "4.2.1"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run tests
        run: |
          make test

      - name: Build for Linux
        run: |
          godot --headless --export-release "Linux/X11" builds/idle-adventurer-linux.x86_64

      - name: Build for Windows
        run: |
          godot --headless --export-release "Windows Desktop" builds/idle-adventurer-windows.exe

      - name: Build for macOS
        run: |
          godot --headless --export-release "macOS" builds/idle-adventurer-macos.zip

      - name: Create release archive
        run: |
          mkdir -p release
          cp builds/idle-adventurer-linux.x86_64 release/
          cp builds/idle-adventurer-windows.exe release/
          cp builds/idle-adventurer-macos.zip release/
          cp README.md release/
          cp LICENSE release/

          # Create a zip with all platforms
          cd release
          zip -r ../idle-adventurer-release.zip .
          cd ..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idle-adventurer-builds
          path: |
            builds/
            idle-adventurer-release.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            idle-adventurer-release.zip
            builds/idle-adventurer-linux.x86_64
            builds/idle-adventurer-windows.exe
            builds/idle-adventurer-macos.zip
          tag_name: v${{ github.run_number }}
          name: Idle Adventurer v${{ github.run_number }}
          body: |
            ## Idle Adventurer Release v${{ github.run_number }}

            Automated build from commit ${{ github.sha }}

            ### Downloads
            - **Linux**: `idle-adventurer-linux.x86_64`
            - **Windows**: `idle-adventurer-windows.exe`
            - **macOS**: `idle-adventurer-macos.zip`
            - **All Platforms**: `idle-adventurer-release.zip`

            ### Installation
            1. Download the appropriate file for your platform
            2. Extract/run the executable
            3. Enjoy your D&D idle adventure!

            ### Changes
            See the [commit history](https://github.com/${{ github.repository }}/commits/main) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
