# Mystical events for the idle adventurer game

events:
  - id: magical_artifact
    name: "Mysterious Artifact"
    description: "You discover a strange, glowing artifact in an abandoned building. It pulses with otherworldly energy and seems to be calling to you."
    event_type: MYSTICAL
    rarity: RARE
    duration_hours: 4
    cooldown_days: 30
    requirements:
      character_level: 5
      location: "abandoned_building"
      time_of_day: "night"
    choices:
      - id: touch_artifact
        description: "Reach out and touch the mysterious artifact"
        requirements:
          constitution: 14
          wisdom: 12
        consequences:
          SUCCESS:
            experience: 200
            magical_ability: "artifact_bond"
            reputation:
              Mystics: 30
            items:
              - id: "mystical_artifact"
                quantity: 1
          FAILURE:
            health_damage: 40
            status_effect: "cursed"
            reputation:
              Mystics: -10
        skill_check:
          skill: "arcana"
          difficulty: 20
      - id: study_artifact
        description: "Study the artifact carefully before touching it"
        requirements:
          intelligence: 15
        consequences:
          SUCCESS:
            experience: 150
            information: "artifact_knowledge"
            reputation:
              Mystics: 20
          FAILURE:
            health_damage: 20
            status_effect: "magical_overload"
        skill_check:
          skill: "arcana"
          difficulty: 16
      - id: leave_artifact
        description: "Leave the artifact alone and report it to the authorities"
        requirements:
          faction_reputation:
            Guard: 10
        consequences:
          NEUTRAL:
            reputation:
              Guard: 15
              Town: 10
            gold: 50

  - id: spirit_encounter
    name: "Spirit Encounter"
    description: "A ghostly figure appears before you, speaking in a language you don't understand. It seems to be trying to communicate something important."
    event_type: MYSTICAL
    rarity: EPIC
    duration_hours: 2
    cooldown_days: 60
    requirements:
      character_level: 8
      location: "ancient_ruins"
      time_of_day: "midnight"
    choices:
      - id: attempt_communication
        description: "Try to communicate with the spirit using magic"
        requirements:
          intelligence: 16
          wisdom: 14
        consequences:
          SUCCESS:
            experience: 300
            magical_knowledge: "spirit_lore"
            reputation:
              Mystics: 50
            quest_opportunity: "spirit_quest"
          FAILURE:
            health_damage: 50
            status_effect: "spirit_curse"
            reputation:
              Mystics: -20
        skill_check:
          skill: "arcana"
          difficulty: 22
      - id: use_divine_magic
        description: "Attempt to communicate using divine magic"
        requirements:
          wisdom: 16
          class: "cleric"
        consequences:
          SUCCESS:
            experience: 250
            divine_favor: "spirit_blessing"
            reputation:
              Church: 40
          FAILURE:
            health_damage: 30
            status_effect: "divine_displeasure"
        skill_check:
          skill: "religion"
          difficulty: 20
      - id: flee_scene
        description: "Flee from the spirit encounter"
        requirements: {}
        consequences:
          NEUTRAL:
            status_effect: "spooked"
            reputation:
              Mystics: -5

  - id: magical_storm
    name: "Magical Storm"
    description: "A strange storm approaches, crackling with magical energy. The very air seems to shimmer with power, and you feel your magical abilities enhanced."
    event_type: MYSTICAL
    rarity: UNCOMMON
    duration_hours: 6
    cooldown_days: 14
    requirements:
      character_level: 4
      location: "outdoors"
      weather: "storm"
    choices:
      - id: embrace_storm
        description: "Embrace the magical energy of the storm"
        requirements:
          constitution: 13
          intelligence: 12
        consequences:
          SUCCESS:
            experience: 100
            magical_enhancement: "storm_power"
            reputation:
              Mystics: 15
          FAILURE:
            health_damage: 25
            status_effect: "magical_burnout"
        skill_check:
          skill: "arcana"
          difficulty: 15
      - id: seek_shelter
        description: "Seek shelter from the magical storm"
        requirements: {}
        consequences:
          NEUTRAL:
            status_effect: "safe_shelter"
            reputation:
              Town: 5
      - id: study_storm
        description: "Study the magical properties of the storm"
        requirements:
          intelligence: 14
        consequences:
          SUCCESS:
            experience: 75
            magical_knowledge: "storm_magic"
            reputation:
              Mystics: 10
          FAILURE:
            health_damage: 15
            status_effect: "magical_overload"
        skill_check:
          skill: "arcana"
          difficulty: 14
