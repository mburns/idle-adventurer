# Economic events for the idle adventurer game

events:
  - id: merchant_opportunity
    name: "Merchant Opportunity"
    description: "A traveling merchant offers you a chance to invest in a trade venture. The potential profits are tempting, but so are the risks."
    event_type: ECONOMIC
    rarity: UNCOMMON
    duration_hours: 4
    cooldown_days: 10
    requirements:
      character_level: 4
      gold: 100
      location: "market_square"
    choices:
      - id: invest_heavily
        description: "Invest a large amount in the trade venture"
        requirements:
          gold: 200
          intelligence: 14
        consequences:
          SUCCESS:
            gold: 300
            reputation:
              Merchants: 25
            experience: 75
          FAILURE:
            gold: -150
            reputation:
              Merchants: -10
        skill_check:
          skill: "investigation"
          difficulty: 16
      - id: invest_moderately
        description: "Invest a moderate amount in the venture"
        requirements:
          gold: 100
        consequences:
          SUCCESS:
            gold: 150
            reputation:
              Merchants: 15
            experience: 50
          FAILURE:
            gold: -50
            reputation:
              Merchants: -5
        skill_check:
          skill: "investigation"
          difficulty: 12
      - id: decline_offer
        description: "Politely decline the investment opportunity"
        requirements: {}
        consequences:
          NEUTRAL:
            reputation:
              Merchants: 5

  - id: treasure_hunt_rumor
    name: "Treasure Hunt Rumor"
    description: "You overhear a conversation about a hidden treasure in the nearby hills. The information seems credible, but you'll need to act quickly."
    event_type: ECONOMIC
    rarity: RARE
    duration_hours: 6
    cooldown_days: 21
    requirements:
      character_level: 6
      location: "tavern"
      time_of_day: "evening"
    choices:
      - id: investigate_immediately
        description: "Leave immediately to investigate the treasure location"
        requirements:
          constitution: 12
        consequences:
          SUCCESS:
            gold: 500
            items:
              - id: "ancient_artifact"
                quantity: 1
            experience: 150
            reputation:
              Town: 20
          FAILURE:
            health_damage: 30
            gold: -50
            status_effect: "exhausted"
        skill_check:
          skill: "survival"
          difficulty: 18
      - id: gather_information
        description: "Spend time gathering more information before acting"
        requirements:
          gold: 25
        consequences:
          SUCCESS:
            gold: 200
            experience: 100
            information: "treasure_map"
          FAILURE:
            gold: -25
            status_effect: "missed_opportunity"
        skill_check:
          skill: "investigation"
          difficulty: 14
      - id: ignore_rumor
        description: "Ignore the rumor and continue with your current activities"
        requirements: {}
        consequences:
          NEUTRAL:
            reputation:
              Town: 2

  - id: gambling_den
    name: "Gambling Den"
    description: "You discover a hidden gambling den in the town's underbelly. The stakes are high, but so are the potential rewards."
    event_type: ECONOMIC
    rarity: UNCOMMON
    duration_hours: 3
    cooldown_days: 7
    requirements:
      character_level: 3
      gold: 50
      location: "seedy_district"
    choices:
      - id: play_high_stakes
        description: "Play the high-stakes games"
        requirements:
          gold: 100
          charisma: 15
        consequences:
          SUCCESS:
            gold: 400
            reputation:
              Criminals: 10
            experience: 60
          FAILURE:
            gold: -100
            reputation:
              Criminals: -5
            status_effect: "gambling_debt"
        skill_check:
          skill: "deception"
          difficulty: 17
      - id: play_moderate_stakes
        description: "Play the moderate-stakes games"
        requirements:
          gold: 50
        consequences:
          SUCCESS:
            gold: 100
            experience: 30
          FAILURE:
            gold: -50
        skill_check:
          skill: "deception"
          difficulty: 13
      - id: observe_only
        description: "Just observe the games without participating"
        requirements: {}
        consequences:
          NEUTRAL:
            information: "criminal_network"
            reputation:
              Criminals: 2
