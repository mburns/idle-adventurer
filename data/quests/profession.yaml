# Profession-related quests for the idle adventurer game

quests:
  - id: apprentice_work
    title: "Apprentice's First Day"
    description: "Start your professional career by taking on apprentice work in your chosen field."
    quest_type: PROFESSION
    status: AVAILABLE
    giver: "Master Craftsman"
    location: "Crafting District"
    time_limit: 0
    requirements:
      character_level: 1
      profession: "any"
    objectives:
      - id: complete_apprentice_tasks
        description: "Complete basic apprentice tasks"
        objective_type: PERFORM_ACTIVITY
        target_value: 5
        requirements:
          activity: "crafting"
          profession: "any"
      - id: learn_trade_secrets
        description: "Learn the basics of your chosen trade"
        objective_type: LEARN_SKILL
        target_value: 1
        requirements:
          skill_type: "crafting"
    rewards:
      experience: 150
      gold: 25
      reputation:
        Guild: 10
      profession_modifiers:
        crafting_speed: 1.1
    prerequisites: []
    unlocks: ["journeyman_work"]

  - id: journeyman_work
    title: "Journeyman's Challenge"
    description: "Prove your skills as a journeyman by completing more complex projects."
    quest_type: PROFESSION
    status: LOCKED
    giver: "Guild Master"
    location: "Guild Hall"
    time_limit: 14
    requirements:
      character_level: 3
      profession: "any"
      faction_reputation:
        Guild: 15
    objectives:
      - id: craft_quality_items
        description: "Craft high-quality items for the guild"
        objective_type: PERFORM_ACTIVITY
        target_value: 3
        requirements:
          activity: "crafting"
          quality: "high"
      - id: teach_apprentice
        description: "Teach an apprentice the basics"
        objective_type: PERFORM_ACTIVITY
        target_value: 1
        requirements:
          activity: "teaching"
    rewards:
      experience: 300
      gold: 100
      reputation:
        Guild: 25
      profession_modifiers:
        crafting_speed: 1.2
        teaching_bonus: 1.1
      items:
        - id: "journeyman_certificate"
          quantity: 1
    prerequisites: ["apprentice_work"]
    unlocks: ["master_work"]

  - id: merchant_contract
    title: "Merchant's Contract"
    description: "A merchant needs reliable suppliers for their trade routes. This could be profitable work."
    quest_type: PROFESSION
    status: AVAILABLE
    giver: "Merchant Guild Representative"
    location: "Market Square"
    time_limit: 30
    requirements:
      character_level: 2
      profession: "merchant"
    objectives:
      - id: establish_trade_routes
        description: "Establish trade connections with other towns"
        objective_type: MAKE_CONNECTIONS
        target_value: 3
        requirements:
          connection_type: "trade"
      - id: generate_profit
        description: "Generate profit through trade activities"
        objective_type: SPEND_GOLD
        target_value: 500
        requirements:
          activity: "trading"
    rewards:
      experience: 250
      gold: 200
      reputation:
        Merchant: 20
        Town: 10
      profession_modifiers:
        trade_efficiency: 1.15
    prerequisites: []
    unlocks: ["merchant_expansion"]
