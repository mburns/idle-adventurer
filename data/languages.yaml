# Language system configuration for the idle adventurer game
# Based on D&D 5e languages with learning mechanics

# All available languages in D&D
languages:
  - id: common
    name: Common
    description: The most widely spoken language
    difficulty: 0
    learning_time_days: 0  # Already known
    cost_per_day: 0.0
    category: standard
    script: Common
    speakers: "Humans, most civilized races"

  - id: dwarvish
    name: Dwarvish
    description: The language of dwarves
    difficulty: 1
    learning_time_days: 250
    cost_per_day: 1.0
    category: standard
    script: Dwarvish
    speakers: "Dwarves, some mountain folk"

  - id: elvish
    name: Elvish
    description: The language of elves
    difficulty: 1
    learning_time_days: 250
    cost_per_day: 1.0
    category: standard
    script: Elvish
    speakers: "Elves, some forest dwellers"

  - id: giant
    name: Giant
    description: The language of giants and ogres
    difficulty: 2
    learning_time_days: 300
    cost_per_day: 1.5
    category: standard
    script: Dwarvish
    speakers: "Giants, ogres, some barbarians"

  - id: gnomish
    name: Gnomish
    description: The language of gnomes
    difficulty: 1
    learning_time_days: 250
    cost_per_day: 1.0
    category: standard
    script: Dwarvish
    speakers: "Gnomes, some tinkerers"

  - id: goblin
    name: Goblin
    description: The language of goblins and hobgoblins
    difficulty: 1
    learning_time_days: 200
    cost_per_day: 0.8
    category: standard
    script: Dwarvish
    speakers: "Goblins, hobgoblins, bugbears"

  - id: halfling
    name: Halfling
    description: The language of halflings
    difficulty: 1
    learning_time_days: 200
    cost_per_day: 0.8
    category: standard
    script: Common
    speakers: "Halflings, some rural folk"

  - id: orc
    name: Orc
    description: The language of orcs
    difficulty: 1
    learning_time_days: 200
    cost_per_day: 0.8
    category: standard
    script: Dwarvish
    speakers: "Orcs, half-orcs, some barbarians"

  - id: abyssal
    name: Abyssal
    description: The language of demons
    difficulty: 3
    learning_time_days: 400
    cost_per_day: 2.0
    category: exotic
    script: Infernal
    speakers: "Demons, some cultists"

  - id: celestial
    name: Celestial
    description: The language of angels
    difficulty: 3
    learning_time_days: 400
    cost_per_day: 2.0
    category: exotic
    script: Celestial
    speakers: "Angels, some clerics"

  - id: draconic
    name: Draconic
    description: The language of dragons
    difficulty: 3
    learning_time_days: 400
    cost_per_day: 2.0
    category: exotic
    script: Draconic
    speakers: "Dragons, dragonborn, some scholars"

  - id: deep_speech
    name: Deep Speech
    description: The language of aberrations
    difficulty: 4
    learning_time_days: 500
    cost_per_day: 3.0
    category: exotic
    script: None
    speakers: "Aberrations, some warlocks"

  - id: infernal
    name: Infernal
    description: The language of devils
    difficulty: 3
    learning_time_days: 400
    cost_per_day: 2.0
    category: exotic
    script: Infernal
    speakers: "Devils, some warlocks"

  - id: primordial
    name: Primordial
    description: The language of elementals
    difficulty: 2
    learning_time_days: 300
    cost_per_day: 1.5
    category: exotic
    script: Dwarvish
    speakers: "Elementals, some druids"

  - id: sylvan
    name: Sylvan
    description: The language of fey creatures
    difficulty: 2
    learning_time_days: 300
    cost_per_day: 1.5
    category: exotic
    script: Elvish
    speakers: "Fey creatures, some druids"

  - id: undercommon
    name: Undercommon
    description: The language of the Underdark
    difficulty: 2
    learning_time_days: 300
    cost_per_day: 1.5
    category: exotic
    script: Elvish
    speakers: "Underdark dwellers, some rogues"

# Language categories and their properties
categories:
  standard:
    name: Standard Languages
    description: Common languages spoken by civilized races
    learning_bonus: 0
    availability: common

  exotic:
    name: Exotic Languages
    description: Rare languages from other planes or ancient times
    learning_bonus: -1
    availability: rare

# Difficulty levels and their effects
difficulty_levels:
  0:
    name: Native
    description: Already known, no learning required
    time_multiplier: 0.0
    cost_multiplier: 0.0

  1:
    name: Easy
    description: Simple languages with common speakers
    time_multiplier: 1.0
    cost_multiplier: 1.0

  2:
    name: Moderate
    description: Languages with moderate complexity
    time_multiplier: 1.2
    cost_multiplier: 1.5

  3:
    name: Hard
    description: Complex languages from other planes
    time_multiplier: 1.5
    cost_multiplier: 2.0

  4:
    name: Extreme
    description: Nearly impossible languages to learn
    time_multiplier: 2.0
    cost_multiplier: 3.0
