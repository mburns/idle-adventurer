# Currency system configuration for the idle adventurer game
# Based on D&D 5e coinage rules with extensibility for custom currencies

# Coin types and their properties
coins:
  - id: cp
    name: Copper Piece
    plural: Copper Pieces
    abbreviation: cp
    weight: 0.02  # pounds per coin (50 coins = 1 pound)
    value_base: 1  # base value for exchange calculations
    description: "Common copper coins used for everyday transactions"
    rarity: common
    material: copper

  - id: sp
    name: Silver Piece
    plural: Silver Pieces
    abbreviation: sp
    weight: 0.02
    value_base: 10
    description: "Silver coins worth 10 copper pieces"
    rarity: common
    material: silver

  - id: ep
    name: Electrum Piece
    plural: Electrum Pieces
    abbreviation: ep
    weight: 0.02
    value_base: 50
    description: "Electrum coins worth 50 copper pieces"
    rarity: uncommon
    material: electrum

  - id: gp
    name: Gold Piece
    plural: Gold Pieces
    abbreviation: gp
    weight: 0.02
    value_base: 100
    description: "Gold coins worth 100 copper pieces"
    rarity: common
    material: gold

  - id: pp
    name: Platinum Piece
    plural: Platinum Pieces
    abbreviation: pp
    weight: 0.02
    value_base: 1000
    description: "Platinum coins worth 1000 copper pieces"
    rarity: rare
    material: platinum

# Exchange rates between coin types
# Format: from_coin -> to_coin: rate (how many to_coin per 1 from_coin)
exchange_rates:
  cp:
    sp: 0.1    # 10 cp = 1 sp
    ep: 0.02   # 50 cp = 1 ep
    gp: 0.01   # 100 cp = 1 gp
    pp: 0.001  # 1000 cp = 1 pp

  sp:
    cp: 10     # 1 sp = 10 cp
    ep: 0.2    # 5 sp = 1 ep
    gp: 0.1    # 10 sp = 1 gp
    pp: 0.01   # 100 sp = 1 pp

  ep:
    cp: 50     # 1 ep = 50 cp
    sp: 5      # 1 ep = 5 sp
    gp: 0.5    # 2 ep = 1 gp
    pp: 0.05   # 20 ep = 1 pp

  gp:
    cp: 100    # 1 gp = 100 cp
    sp: 10     # 1 gp = 10 sp
    ep: 2      # 1 gp = 2 ep
    pp: 0.1    # 10 gp = 1 pp

  pp:
    cp: 1000   # 1 pp = 1000 cp
    sp: 100    # 1 pp = 100 sp
    ep: 20     # 1 pp = 20 ep
    gp: 10     # 1 pp = 10 gp

