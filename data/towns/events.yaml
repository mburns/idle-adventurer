# Town events configuration
events:
  market_day:
    id: "market_day"
    name: "Market Day"
    event_type: "MARKET_DAY"
    description: "A special market day with extra vendors and deals"
    duration_days: 1
    effects:
      shop_discounts: 0.2
      extra_vendors: 3
    requirements: {}
    rewards:
      gold: 25
      trade_opportunities: 2

  harvest_festival:
    id: "harvest_festival"
    name: "Harvest Festival"
    event_type: "FESTIVAL"
    description: "A celebration of the harvest with food, music, and games"
    duration_days: 3
    effects:
      town_morale: 50
      visitor_increase: 100
    requirements: {}
    rewards:
      town_reputation: 15
      social_connections: 5
      gold: 50

  crime_wave:
    id: "crime_wave"
    name: "Crime Wave"
    event_type: "CRIME_WAVE"
    description: "Increased criminal activity requires extra vigilance"
    duration_days: 7
    effects:
      security_increase: 25
      guard_patrols: 50
    requirements:
      guard_reputation: 20
    rewards:
      guard_reputation: 10
      combat_exp: 25

  noble_visitor:
    id: "noble_visitor"
    name: "Noble Visitor"
    event_type: "VISITOR"
    description: "An important noble visits the town"
    duration_days: 2
    effects:
      noble_attention: 100
      social_opportunities: 50
    requirements:
      noble_reputation: 30
    rewards:
      noble_reputation: 20
      political_connections: 3

  trade_deal:
    id: "trade_deal"
    name: "Trade Deal"
    event_type: "TRADE_DEAL"
    description: "A lucrative trade opportunity presents itself"
    duration_days: 5
    effects:
      trade_increase: 75
      merchant_activity: 100
    requirements:
      merchant_reputation: 25
    rewards:
      gold: 200
      trade_connections: 5

  # Additional events
  spring_festival:
    id: "spring_festival"
    name: "Spring Festival"
    event_type: "FESTIVAL"
    description: "A celebration of spring with flowers, music, and dancing"
    duration_days: 2
    effects:
      town_morale: 30
      visitor_increase: 50
    requirements: {}
    rewards:
      town_reputation: 10
      social_connections: 3
      gold: 25

  winter_solstice:
    id: "winter_solstice"
    name: "Winter Solstice"
    event_type: "RELIGIOUS_EVENT"
    description: "A sacred religious ceremony celebrating the winter solstice"
    duration_days: 1
    effects:
      religious_fervor: 100
      temple_activity: 200
    requirements: {}
    rewards:
      temple_reputation: 15
      spiritual_peace: 1
      gold: 30

  merchant_caravan:
    id: "merchant_caravan"
    name: "Merchant Caravan"
    event_type: "TRADE_DEAL"
    description: "A wealthy merchant caravan arrives with exotic goods"
    duration_days: 3
    effects:
      exotic_goods: 50
      trade_increase: 100
    requirements:
      merchant_reputation: 15
    rewards:
      gold: 150
      exotic_items: 2
      merchant_reputation: 10

  bandit_threat:
    id: "bandit_threat"
    name: "Bandit Threat"
    event_type: "EMERGENCY"
    description: "Bandits threaten the town's trade routes"
    duration_days: 5
    effects:
      security_increase: 50
      guard_patrols: 100
    requirements:
      guard_reputation: 10
    rewards:
      guard_reputation: 15
      combat_exp: 30
      gold: 75

  royal_visit:
    id: "royal_visit"
    name: "Royal Visit"
    event_type: "VISITOR"
    description: "A member of the royal family visits the town"
    duration_days: 3
    effects:
      royal_attention: 200
      social_opportunities: 100
    requirements:
      noble_reputation: 50
    rewards:
      royal_reputation: 25
      political_connections: 5
      gold: 100

  plague_outbreak:
    id: "plague_outbreak"
    name: "Plague Outbreak"
    event_type: "EMERGENCY"
    description: "A mysterious plague affects the town"
    duration_days: 10
    effects:
      town_morale: -50
      temple_activity: 200
    requirements:
      temple_reputation: 20
    rewards:
      temple_reputation: 20
      healing_knowledge: 1
      gold: 50

  construction_project:
    id: "construction_project"
    name: "Construction Project"
    event_type: "CONSTRUCTION"
    description: "A major construction project begins in town"
    duration_days: 14
    effects:
      craftsman_activity: 150
      town_growth: 25
    requirements:
      craftsman_reputation: 30
    rewards:
      craftsman_reputation: 15
      gold: 100
      construction_knowledge: 1

  weather_event:
    id: "weather_event"
    name: "Severe Weather"
    event_type: "WEATHER_EVENT"
    description: "Severe weather affects the town"
    duration_days: 3
    effects:
      travel_difficulty: 100
      indoor_activity: 200
    requirements: {}
    rewards:
      survival_skill: 5
      gold: 20

  political_event:
    id: "political_event"
    name: "Political Change"
    event_type: "POLITICAL_EVENT"
    description: "A change in local government occurs"
    duration_days: 7
    effects:
      political_activity: 100
      town_meetings: 200
    requirements:
      town_reputation: 25
    rewards:
      political_connections: 3
      town_reputation: 10
      gold: 40

  religious_event:
    id: "religious_event"
    name: "Religious Ceremony"
    event_type: "RELIGIOUS_EVENT"
    description: "A major religious ceremony takes place"
    duration_days: 2
    effects:
      religious_fervor: 150
      temple_activity: 300
    requirements: {}
    rewards:
      temple_reputation: 10
      spiritual_peace: 1
      gold: 25
