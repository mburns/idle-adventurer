# Merchant Professions
# Traders, shopkeepers, and commercial workers

professions:
  - id: "shopkeeper"
    name: "Shopkeeper"
    profession_type: "MERCHANT"
    description: "Buy and sell goods in a general store"
    requirements:
      charisma: 12
      gold: 50
    daily_income: 10
    reputation_gain: 1
    skill_requirements:
      - "Persuasion"
      - "Insight"
    tool_requirements:
      - "Abacus"
      - "Shop"
    location: "General Store"
    schedule:
      start_hour: 8
      end_hour: 20
      days: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday"]
    advancement_requirements:
      level_2:
        experience_days: 20
        reputation: 30
        gold_cost: 100
      level_3:
        experience_days: 40
        reputation: 60
        gold_cost: 300
    benefits:
      level_1:
        - "Basic trading"
        - "Price negotiation"
      level_2:
        - "Advanced trading"
        - "Bulk discounts"
        - "Market knowledge"
      level_3:
        - "Master trader"
        - "Exclusive goods"
        - "Teaching ability"

  - id: "trader"
    name: "Trader"
    profession_type: "MERCHANT"
    description: "Travel between towns buying and selling goods"
    requirements:
      charisma: 13
      gold: 200
    daily_income: 20
    reputation_gain: 2
    skill_requirements:
      - "Persuasion"
      - "Survival"
    tool_requirements:
      - "Wagon"
      - "Trade Goods"
    location: "Traveling"
    schedule:
      start_hour: 6
      end_hour: 18
      days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
    advancement_requirements:
      level_2:
        experience_days: 35
        reputation: 70
        gold_cost: 400
      level_3:
        experience_days: 70
        reputation: 140
        gold_cost: 800
    benefits:
      level_1:
        - "Basic trading routes"
        - "Simple goods"
      level_2:
        - "Advanced routes"
        - "Rare goods"
        - "Trade networks"
      level_3:
        - "Master trader"
        - "Exotic goods"
        - "Teaching ability"

  - id: "money_lender"
    name: "Money Lender"
    profession_type: "MERCHANT"
    description: "Provide loans and financial services"
    requirements:
      intelligence: 14
      gold: 500
    daily_income: 25
    reputation_gain: 1
    skill_requirements:
      - "Insight"
      - "Investigation"
    tool_requirements:
      - "Abacus"
      - "Contracts"
    location: "Bank"
    schedule:
      start_hour: 9
      end_hour: 17
      days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
    advancement_requirements:
      level_2:
        experience_days: 40
        reputation: 80
        gold_cost: 1000
      level_3:
        experience_days: 80
        reputation: 160
        gold_cost: 2000
    benefits:
      level_1:
        - "Basic loans"
        - "Interest collection"
      level_2:
        - "Advanced loans"
        - "Investment advice"
        - "Financial planning"
      level_3:
        - "Master banker"
        - "Large investments"
        - "Teaching ability"
