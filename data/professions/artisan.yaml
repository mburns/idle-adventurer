# Artisan Professions
# Craftsmen, artisans, and skilled workers

professions:
  - id: "blacksmith"
    name: "Blacksmith"
    profession_type: "ARTISAN"
    description: "Craft weapons, armor, and metal tools"
    requirements:
      strength: 13
      gold: 100
    daily_income: 15
    reputation_gain: 1
    skill_requirements:
      - "Smith's Tools"
      - "Athletics"
    tool_requirements:
      - "Smith's Tools"
      - "Forge"
    location: "Smithy"
    schedule:
      start_hour: 6
      end_hour: 18
      days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
    advancement_requirements:
      level_2:
        experience_days: 30
        reputation: 50
        gold_cost: 200
      level_3:
        experience_days: 60
        reputation: 100
        gold_cost: 500
    benefits:
      level_1:
        - "Basic weapon crafting"
        - "Simple armor repair"
      level_2:
        - "Advanced weapon crafting"
        - "Armor crafting"
        - "Tool making"
      level_3:
        - "Masterwork items"
        - "Magical item repair"
        - "Teaching ability"

  - id: "carpenter"
    name: "Carpenter"
    profession_type: "ARTISAN"
    description: "Build furniture, structures, and wooden items"
    requirements:
      strength: 12
      gold: 75
    daily_income: 12
    reputation_gain: 1
    skill_requirements:
      - "Carpenter's Tools"
      - "Athletics"
    tool_requirements:
      - "Carpenter's Tools"
      - "Workshop"
    location: "Carpenter's Shop"
    schedule:
      start_hour: 7
      end_hour: 17
      days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
    advancement_requirements:
      level_2:
        experience_days: 25
        reputation: 40
        gold_cost: 150
      level_3:
        experience_days: 50
        reputation: 80
        gold_cost: 400
    benefits:
      level_1:
        - "Basic furniture crafting"
        - "Simple repairs"
      level_2:
        - "Advanced furniture"
        - "Building construction"
        - "Tool making"
      level_3:
        - "Masterwork furniture"
        - "Architectural design"
        - "Teaching ability"

  - id: "leatherworker"
    name: "Leatherworker"
    profession_type: "ARTISAN"
    description: "Craft leather goods, armor, and accessories"
    requirements:
      dexterity: 13
      gold: 80
    daily_income: 13
    reputation_gain: 1
    skill_requirements:
      - "Leatherworker's Tools"
      - "Sleight of Hand"
    tool_requirements:
      - "Leatherworker's Tools"
      - "Tanning Vat"
    location: "Leatherworker's Shop"
    schedule:
      start_hour: 8
      end_hour: 18
      days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
    advancement_requirements:
      level_2:
        experience_days: 28
        reputation: 45
        gold_cost: 180
      level_3:
        experience_days: 55
        reputation: 90
        gold_cost: 450
    benefits:
      level_1:
        - "Basic leather goods"
        - "Simple armor"
      level_2:
        - "Advanced leather armor"
        - "Quality accessories"
        - "Tool making"
      level_3:
        - "Masterwork leather"
        - "Magical leather items"
        - "Teaching ability"
