# Exchange rates for digital currency example
exchange_rates:
  cred:
    token: 0.1    # 10 cred = 1 token
    chip: 0.01    # 100 cred = 1 chip

  token:
    cred: 10      # 1 token = 10 cred
    chip: 0.1     # 10 token = 1 chip

  chip:
    cred: 100     # 1 chip = 100 cred
    token: 10     # 1 chip = 10 token
