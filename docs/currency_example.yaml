# Example: Non-precious metal currency system
# This shows how you could completely ditch precious metals and use any currency system

# Example 1: Digital/Electronic Currency System
coins:
  - id: cred
    name: Credit
    plural: Credits
    abbreviation: cred
    weight: 0.0  # Digital currency has no weight
    value_base: 1
    description: "Digital currency units used for electronic transactions"
    rarity: common
    material: digital

  - id: token
    name: Token
    plural: Tokens
    abbreviation: tok
    weight: 0.01
    value_base: 10
    description: "Physical tokens representing stored value"
    rarity: common
    material: plastic

  - id: chip
    name: Chip
    plural: Chips
    abbreviation: chip
    weight: 0.005
    value_base: 100
    description: "High-value chips used for major transactions"
    rarity: uncommon
    material: ceramic

